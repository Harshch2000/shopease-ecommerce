server.port=8080
# Default: in-memory H2 (zero setup). For MySQL run with: --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:mem:ecommerce;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-message=always
# JWT (secret must be at least 32 characters - change it for production)
app.jwt.secret=change-this-secret-key-to-a-long-random-string-123456
app.jwt.expiration-ms=86400000
app.cors.allowed-origin=http://localhost:4200
